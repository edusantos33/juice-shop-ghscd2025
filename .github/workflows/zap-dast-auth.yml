name: DAST - ZAP Authenticated Baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  zap-authenticated:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------
      # 1. Subir a aplicação
      # ------------------------------------------------------
      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop

      # ------------------------------------------------------
      # 2. Esperar aplicação ficar disponível
      # ------------------------------------------------------
      - name: Wait for Juice Shop
        run: |
          echo "Waiting for Juice Shop..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Juice Shop is ready!"
              exit 0
            fi

            sleep 3
          done

          echo "Juice Shop did not start."
          exit 1

      # ------------------------------------------------------
      # 3. Autenticar antes do ZAP
      # ------------------------------------------------------
      - name: Login to Juice Shop
        id: login
        env:
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASSWORD: ${{ secrets.ZAP_PASSWORD }}
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://127.0.0.1:3000/rest/user/login \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg email "$ZAP_USER" \
              --arg password "$ZAP_PASSWORD" \
              '{email:$email,password:$password}')")

          TOKEN=$(echo "$RESPONSE" | jq -r '.authentication.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Authentication failed!"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "Authentication successful!"

      # ------------------------------------------------------
      # 4. ZAP autenticado
      # ------------------------------------------------------
      - name: ZAP Authenticated Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0

        env:
          ZAP_AUTH_HEADER_VALUE: "Bearer ${{ steps.login.outputs.token }}"
          ZAP_AUTH_HEADER: "Authorization"
          ZAP_AUTH_HEADER_SITE: "127.0.0.1"

        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: http://127.0.0.1:3000

          docker_name: ghcr.io/zaproxy/zaproxy:stable

          cmd_options: "-a -m 3"

          fail_action: false

          artifact_name: zap-authenticated-report

      # ------------------------------------------------------
      # 5. Debug opcional
      # ------------------------------------------------------
      - name: Show Juice Shop logs
        if: always()
        run: |
          docker logs juice-shop | tail -50
